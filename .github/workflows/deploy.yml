name: CI and CD

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vpe04-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vpe04-github-actions

jobs:
  build-and-push:
    name: Test, build and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy image to VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vpe04_deploy
          chmod 600 ~/.ssh/vpe04_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Log in to GHCR on VPS
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/vpe04_deploy "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
      - name: Pull and restart container
        run: |
          ssh -i ~/.ssh/vpe04_deploy "$VPS_USER@$VPS_HOST" \
            "docker pull $IMAGE_NAME:$IMAGE_TAG && docker rm -f vpe04-flask-app 2>/dev/null || true; docker run -d --name vpe04-flask-app --restart unless-stopped --health-cmd='python -c \"import urllib.request; urllib.request.urlopen(\\\"http://127.0.0.1:5000/health\\\", timeout=2)\"' --health-interval=10s --health-timeout=3s --health-retries=3 -e APP_ENV=vps -e APP_VERSION=$IMAGE_TAG -p 127.0.0.1:5056:5000 $IMAGE_NAME:$IMAGE_TAG"
          sleep 5
          ssh -i ~/.ssh/vpe04_deploy "$VPS_USER@$VPS_HOST" \
            "curl --fail --silent http://127.0.0.1:5056/health"
